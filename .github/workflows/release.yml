name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  release:
    uses: tobyrosen/oss-workflows/.github/workflows/release.yml@25c924d852de6066b1b358bf39cf0cbbcb60f1b7 # v1
    with:
      profile: claude-skill
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets: inherit
